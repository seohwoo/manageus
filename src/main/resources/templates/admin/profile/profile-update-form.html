<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>SB Admin 2 - Profile</title>

    <!-- Custom fonts for this template-->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <style>
        .profile-table {
            width: 100%;
            border-collapse: collapse;
        }
        .profile-table th, .profile-table td {
            padding: 8px;
            text-align: left;
            border-top: 1px solid #dee2e6; /* 위쪽 테두리 */
            border-bottom: 1px solid #dee2e6; /* 아래쪽 테두리 */
        }
        .profile-table th {
            width: 30%; /* 필요한 경우 th 너비 조정 */
        }
        .profile-table tr:first-child th, .profile-table tr:first-child td {
            border-top: none; /* 첫 번째 행의 위쪽 테두리 제거 */
        }
        .profile-table tr:last-child th, .profile-table tr:last-child td {
            border-bottom: none; /* 마지막 행의 아래쪽 테두리 제거 */
        }
    </style>

</head>

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

    <div th:include="~{content/admin-side-bar :: adminside}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <div th:include="~{content/admin-top-bar :: admintop}"></div>

            <!-- Begin Page Content -->
            <div class="container-fluid">

                <!-- Page Heading -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">Profile</h1>
                </div>

                <!-- Profile Information -->
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card shadow mb-4">
                            <form th:action="@{~/admin/profile/companies/{companyId}(companyId=${companyId})}" method="post">
                                <input type="hidden" name="_method" value="put" />
                                <input type="hidden" class="form-control" th:value="${companyId}" name="id" />
                                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                                    <h5 class="m-0 font-weight-bold text-primary">회사정보</h5>
                                    <button type="submit" class="btn btn-success btn-icon-split">
                                        <span class="icon text-white-50">
                                            <i class="fas fa-check"></i>
                                        </span>
                                        <span class="text">Submit</span>
                                    </button>
                                </div>
                                <div class="card-body">
                                    <table class="profile-table">
                                        <tr>
                                            <th>회사명</th>
                                            <td th:text="${companyName}"></td>
                                            <input type="hidden" class="form-control" th:value="${companyName}" name="name" />
                                        </tr>
                                        <tr>
                                            <th>사업자번호</th>
                                            <td th:text="${businessNum}"></td>
                                            <input type="hidden" class="form-control" th:value="${businessNum}" name="businessNum" />
                                        </tr>
                                        <tr>
                                            <th>회사코드</th>
                                            <td th:text="${inviteCode}"></td>
                                            <input type="hidden" class="form-control" th:value="${inviteCode}" name="inviteCode" />
                                        </tr>
                                        <tr>
                                            <th>CEO</th>
                                            <td><input type="text" class="form-control" th:value="${ceo}" name="ceo"></td>
                                        </tr>
                                        <tr>
                                            <th>사원수</th>
                                            <td th:text="${employees} + 명"></td>
                                        </tr>
                                        <tr>
                                            <th>이메일</th>
                                            <td><input type="email" class="form-control" th:value="${email}" name="email"></td>
                                        </tr>
                                        <tr>
                                            <th>주소</th>
                                            <td><input type="text" class="form-control" th:value="${address}" name="address"></td>
                                        </tr>
                                        <tr>
                                            <th>가입일</th>
                                            <td th:text="${#dates.format(regDate, 'yyyy/MM/dd')}"></td>
                                        </tr>
                                    </table>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
            <!-- /.container-fluid -->

        </div>
        <!-- End of Main Content -->

        <div th:include="~{content/footer :: footer}"></div>

    </div>
    <!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->

<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<!-- Bootstrap core JavaScript-->
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Core plugin JavaScript-->
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="/js/sb-admin-2.min.js"></script>

<!-- Page level plugins -->
<script src="/vendor/chart.js/Chart.min.js"></script>

<!-- Page level custom scripts -->
<script src="/js/demo/chart-area-demo.js"></script>
<script src="/js/demo/chart-pie-demo.js"></script>

</body>

</html>
