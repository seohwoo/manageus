<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:fragment="side">
    <!-- Sidebar -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

        <!-- Sidebar - Brand -->
        <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/manageus/companies/{companyId}(companyId=${companyId})}">
            <div class="sidebar-brand-icon rotate-n-15">
                <i class="fas fa-laugh-wink"></i>
            </div>
            <div class="sidebar-brand-text mx-3" th:text="${company}"></div>
        </a>

        <!-- Divider -->
        <hr class="sidebar-divider my-0">

        <!-- Divider -->
        <hr class="sidebar-divider">

        <!-- Heading -->
        <div class="sidebar-heading">
            Interface
        </div>

        <li class="nav-item">
            <a class="nav-link collapsed" href="#" data-toggle="collapse" data-target="#collapseTwo"
               aria-expanded="true" aria-controls="collapseTwo">
                <i class="fas fa-fw fa-envelope"></i>
                <span>쪽지</span>
            </a>
            <div id="collapseTwo" class="collapse" aria-labelledby="headingTwo" data-parent="#accordionSidebar">
                <div class="bg-white py-2 collapse-inner rounded">
                    <h6 class="collapse-header">쪽지:</h6>
                    <a class="collapse-item" th:href="@{/manageus/alarm/messages/new}">쪽지 보내기</a>
                    <a class="collapse-item" th:href="@{/manageus/alarm/messages/spend}">보낸 쪽지함</a>
                    <a class="collapse-item" th:href="@{/manageus/alarm/messages/receive}">받은 쪽지함</a>
                </div>
            </div>
        </li>
        <!-- 여기부터 url 적어주면돼 -->
        <!-- Nav Item - Charts -->
        <li class="nav-item">
            <a class="nav-link" th:href="@{/manageus/approval/posts}">
                <i class="fas fa-fw fa-file-signature"></i>
                <span>결재</span></a>
        </li>

        <li class="nav-item">
            <a class="nav-link" th:href="@{/manageus/chat}">
                <i class="fas fa-fw fa-comment"></i>
                <span>채팅</span></a>
        </li>

        <li class="nav-item">
            <a class="nav-link" th:href="@{/manageus/attendance/users/{id}(id=${id})}">
                <i class="fas fa-fw fa-clock"></i>
                <span>근태</span></a>
        </li>

        <!-- Nav Item - Pages Collapse Menu -->
        <li class="nav-item">
            <a class="nav-link collapsed" href="#" data-toggle="collapse" data-target="#collapseUtilities"
               aria-expanded="true" aria-controls="collapseUtilities">
                <i class="fas fa-fw fa-calendar"></i>
                <span>캘린더</span>
            </a>
            <div id="collapseUtilities" class="collapse" aria-labelledby="headingUtilities"
                 data-parent="#accordionSidebar">
                <div class="bg-white py-2 collapse-inner rounded">
                    <h6 class="collapse-header">달력:</h6>
                    <a class="collapse-item" th:href="@{/manageus/calendar/companies/{companyId}(companyId=${companyId})}">회사</a>
                    <a class="collapse-item" th:href="@{/manageus/calendar/department/{departmentId}(departmentId=${departmentId})}">부서</a>
                    <a class="collapse-item" th:href="@{/manageus/calendar/users/{id}(id=${id})}">개인</a>
                </div>
            </div>
        </li>

        <li class="nav-item">
            <a class="nav-link" th:href="@{/manageus/project/users/{id}(id=${id})}">
                <i class="fas fa-fw fa-file-contract"></i>
                <span>프로젝트</span></a>
        </li>
        <!-- 여기까지다 -->

        <!-- Divider -->
        <hr class="sidebar-divider">

        <!-- Divider -->
        <hr class="sidebar-divider d-none d-md-block">

        <!-- Sidebar Toggler (Sidebar) -->
        <div class="text-center d-none d-md-inline">
            <button class="rounded-circle border-0" id="sidebarToggle"></button>
        </div>

    </ul>
    <!-- End of Sidebar -->
    </div>
</body>
</html>
