<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>ManageUs 프로젝트</title>
    <!-- Favicon-->
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">

    <!-- Custom fonts for this template-->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">



</head>

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

    <div th:insert="~{content/side-bar :: side}"></div>
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <div th:insert="~{content/top-bar :: top}"></div>
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">업무 상세 정보</h6>
                    </div>
                    <div class="card-body">
                        <div class="row mb-2">
                            <div class="col-sm-3 font-weight-bold">업무명:</div>
                            <div class="col-sm-9"><span th:text="${detail.title}"></span></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-sm-3 font-weight-bold">업무내용:</div>
                            <div class="col-sm-9"><span th:text="${detail.content}"></span></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-sm-3 font-weight-bold">업무상태:</div>
                            <div class="col-sm-9"><span th:text="${detail.status.name}"></span></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-sm-3 font-weight-bold">시작일:</div>
                            <div class="col-sm-9"><span th:text="${#dates.format(detail.startTime, 'yyyy-MM-dd')}"></span></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-sm-3 font-weight-bold">마감일:</div>
                            <div class="col-sm-9"><span th:text="${#dates.format(detail.endTime, 'yyyy-MM-dd')}"></span></div>
                        </div>
                    </div>
                    <div class="card-footer text-right">
                        <button class="btn btn-primary"
                                th:attr="onclick=|location.href='@{/manageus/project/users/{userId}/projects/{projectId}/details/{projectDetailId}/edit(userId=${userId}, projectId=${projectId}, projectDetailId=${projectDetailId})}'|">업무 수정</button>
                        <button class="btn btn-secondary"
                                th:attr="onclick=|location.href='@{/manageus/project/users/{userId}/projects/{projectId}(userId=${userId}, projectId=${projectId})}'|">뒤로가기</button>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->

        </div>
        <!-- End of Main Content -->

        <div th:include="~{content/footer :: footer}"></div>

    </div>
    <!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->

<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<!-- Bootstrap core JavaScript-->
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Core plugin JavaScript-->
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="/js/sb-admin-2.min.js"></script>

</body>

</html>
