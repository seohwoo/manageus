<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .buttons {
            margin: 20px 0;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f4f4f4;
        }
    </style>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>ManageUs 근태</title>
    <!-- Favicon-->
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">

    <!-- Custom fonts for this template-->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap core JavaScript -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function () {
        const attendanceBody = $('#attendance-body');

        // 현재 월의 날짜를 생성하는 함수
        function generateDatesForMonth(year, month) {
            const daysInMonth = new Date(year, month, 0).getDate();
            for (let day = 1; day <= daysInMonth; day++) {
                const date = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const newRow = `
                    <tr id="row-${date}">
                        <td>${date}</td>
                        <td id="check-in-${date}"></td>
                        <td id="check-out-${date}"></td>
                        <td id="note-${date}" class="note-text"></td>
                    </tr>`;
                attendanceBody.append(newRow);
            }
        }

        const today = new Date();
        generateDatesForMonth(today.getFullYear(), today.getMonth() + 1);

        const userId = $('#userId').val(); // 사용자 ID
        const companyId = $('#companyId').val();









        // 출근 버튼 클릭 시 처리
            $('#check-in').click(function() {

                const note = $('#note').val();

                // 예시로 데이터를 업데이트하는 함수 호출
                inCompany(companyId,userId,note);
            });

            // 퇴근 버튼 클릭 시 처리
            $('#check-out').click(function() {
                // 예시로 데이터를 업데이트하는 함수 호출
                outCompany(userId);
            });





            // 출근 또는 퇴근 시간을 업데이트하는 함수
            function inCompany(companyId,userId,note) {
                // 서버로 데이터 전송 및 업데이트 예시 (실제 서버 코드에 맞게 수정 필요)
                $.ajax({
                    type: "POST", // 예시이므로 실제 HTTP 메서드는 POST 또는 PUT 등으로 적절히 변경해야 함
                    url: '/ajax/attendance/inCompany',
                    contentType: "application/json; charset=utf-8",
                    data: JSON.stringify({
                        companyId: companyId,
                        userId: userId,
                        note: note
                    }),
                    success: function(response) {

                        // 시간 데이터를 화면에 업데이트
                        if(response.sameResult == 0){
                        alert("출근 처리되었습니다.");
                        window.location.reload();

                        }
                        if(response.sameResult == 1){
                        alert("이미 출근을 하셨습니다.");
                        }

                    },
                    error: function(xhr, status, error) {
                        alert('출근 또는 퇴근 시간을 업데이트하는 도중 오류가 발생했습니다.');
                    }
                });
            }

            function outCompany(userId) {
                // 서버로 데이터 전송 및 업데이트 예시 (실제 서버 코드에 맞게 수정 필요)
                $.ajax({
                    type: "POST", // 예시이므로 실제 HTTP 메서드는 POST 또는 PUT 등으로 적절히 변경해야 함
                    url: '/ajax/attendance/outCompany',
                    contentType: "application/json; charset=utf-8",
                    data: JSON.stringify({
                        userId: userId
                    }),
                    success: function(response) {

                        if(response.outResult == 0){
                            alert("이미 퇴근처리되었습니다.");
                        }
                        if(response.outResult == -1){
                            alert("출근을 먼저 해주세요!");
                        }
                        if(response.outResult == 1){
                            alert("퇴근 처리 되었습니다.");
                            window.location.reload();
                        }
                    },
                    error: function(xhr, status, error) {
                        alert('출근 또는 퇴근 시간을 업데이트하는 도중 오류가 발생했습니다.');
                    }
                });
            }













        $.ajax({
            type: "GET",
            url: '/ajax/attendance/getAttendance',
            contentType: "application/json; charset=utf-8",
            data: { userId: userId },
            success: function(response) {

                const data = response.attendanceList;

                if (Array.isArray(data)) {
                    data.forEach(function(record) {
                        const date = new Date(record.date);
                        const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().split('T')[0];

                        const checkInTime = record.startTime ? new Date(record.startTime).toLocaleTimeString() : '';
                        const checkOutTime = record.endTime ? new Date(record.endTime).toLocaleTimeString() : '';
                        const note = record.note || '';

                        $(`#check-in-${localDate}`).text(checkInTime);
                        $(`#check-out-${localDate}`).text(checkOutTime);
                        $(`#note-${localDate}`).text(note);
                    });
                } else {
                }
            },
            error: function(xhr, status, error) {
            }
        });
    });
    </script>



</head>

<body id="page-top">

<div id="wrapper">

    <div th:insert="~{content/side-bar :: side}"></div>
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <div th:insert="~{content/top-bar :: top}"></div>
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <div class="container">
                    <input type="hidden" id="userId" th:value="${userId}">
                    <input type="hidden" id="companyId" th:value="${companyId}">
                    <h1 class="mt-5">근태관리 시스템</h1>
                    <div class="buttons mt-3">
                        비고 : <input type="text" name="note" id="note"><br/>
                        <button id="check-in" class="btn btn-primary">출근</button>
                        <button id="check-out" class="btn btn-danger">퇴근</button>
                    </div>
                    <table class="table mt-5">
                        <thead>
                        <tr>
                            <th>날짜</th>
                            <th>출근 시간</th>
                            <th>퇴근 시간</th>
                            <th>비고</th>
                        </tr>
                        </thead>
                        <tbody id="attendance-body">
                        <!-- 날짜별 출퇴근 기록이 여기에 추가됩니다 -->
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- /.container-fluid -->

        </div>
        <!-- End of Main Content -->

        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
