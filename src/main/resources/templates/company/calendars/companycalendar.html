<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>회사달력</title>
    <!-- Favicon-->
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">

    <!-- Custom fonts for this template-->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.js'></script>

    <style>
        #calendar {
         max-width: 1100px;
         margin: 0 auto;
        }

        /* The Close Button */
        .close {
          color: #aaa;
          float: right;
          font-size: 28px;
          font-weight: bold;
        }

        .close:hover,
        .close:focus {
          color: black;
          text-decoration: none;
          cursor: pointer;
        }
    </style>


</head>

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

    <div th:include="~{content/side-bar :: side}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <div th:include="~{content/top-bar :: top}"></div>

            <!-- Begin Page Content -->
            <div class="container-fluid">
                <!-- Page Heading -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">회사캘린더</h1>
                </div>

                <input type="hidden" id="companyId" th:value="${companyId}">
                <input type="hidden" id="calendarId">
                <br>
                <div id='calendar'></div>
            </div>
            <!-- End of Main Content -->

            <div th:include="~{content/footer :: footer}"></div>

        </div>
        <!-- End of Content Wrapper -->

    </div>
</div>
<!-- End of Page Wrapper -->

<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<!-- Bootstrap core JavaScript-->
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Core plugin JavaScript-->
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="/js/sb-admin-2.min.js"></script>




<!--달력라이브러리-->


<script th:inline="javascript">
    $(document).ready(function() {
        var calendarType = 0;
        var companyId = $('#companyId').val(); // userId 값을 가져옴
        var calendarId;

        // AJAX 요청으로 캘린더 데이터를 가져옴
        $.ajax({
            type: "GET",
            url: '/ajax/calendar/getCompanyCalendarList',
            contentType: "application/json; charset=utf-8",
            data: {
                calendarType: calendarType,
                companyId: companyId
            },
            success: function(data) {
                calendarId = data.calendarId;
                $('#calendarId').val(calendarId);

                // FullCalendar 초기화
                var calendarEl = document.getElementById('calendar');
                var calendar = new FullCalendar.Calendar(calendarEl, {
                    headerToolbar: {
                        left: 'prevYear,prev,next,nextYear today',
                        center: 'title',
                        right: 'dayGridMonth,dayGridWeek,dayGridDay'
                    },
                    initialDate: new Date().toISOString().split('T')[0], // 오늘 날짜로 초기화
                    navLinks: true,
                    editable: true,
                    dayMaxEvents: true,
                    locale: 'ko', // 한국어 설정
                    customButtons: {
                        addEventButton: {
                            text: '일정 추가',
                            click: function() {
                                document.getElementById('eventModal').style.display = 'block';
                            }
                        }
                    }
                });

                // 가져온 일정 데이터를 달력에 추가
                data.calendarDetailEntityList.forEach(function(event) {
                    calendar.addEvent({
                        title: event.content,  // 일정 제목
                        start: event.startDate,  // 시작 날짜 및 시간
                        end: event.endDate,  // 종료 날짜 및 시간
                        color: event.color  // 일정 색상
                    });
                });

                calendar.render(); // 달력 렌더링

            },
            error: function(error) {
            }
        });
    });
</script>



</body>

</html>
